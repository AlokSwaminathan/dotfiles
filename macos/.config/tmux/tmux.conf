# =============================================================================
# General
# =============================================================================

# Set prefix to Ctrl-a (easier to reach than Ctrl-b)
unbind C-b
set -g prefix C-a
bind C-a send-prefix

# Increase scrollback buffer
set -g history-limit 10000

# Start windows and panes at 1, not 0
set -g base-index 1
setw -g pane-base-index 1

# Renumber windows when one is closed
set -g renumber-windows on

# Reduce escape-time for faster key response (important for vim/neovim)
set -sg escape-time 10

# Enable focus events (for vim autoread etc.)
set -g focus-events on

# Enable mouse support
set -g mouse on

# =============================================================================
# Display
# =============================================================================

# Use 256 colors and true color
set -g default-terminal "tmux-256color"
set -as terminal-features ",xterm-256color:RGB"

# Activity monitoring
setw -g monitor-activity on
set -g visual-activity off

# =============================================================================
# Key bindings
# =============================================================================

# Reload config
bind r source-file ~/.config/tmux/tmux.conf \; display "Config reloaded"

# Split panes using | and - (intuitive)
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
unbind '"'
unbind %

# New window in current path
bind c new-window -c "#{pane_current_path}"

# Pane resizing with capital letters (repeatable)
bind -r H resize-pane -L 5
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r L resize-pane -R 5

# Switch windows with Alt+number (no prefix needed)
bind -n M-1 select-window -t 1
bind -n M-2 select-window -t 2
bind -n M-3 select-window -t 3
bind -n M-4 select-window -t 4
bind -n M-5 select-window -t 5
bind -n M-6 select-window -t 6
bind -n M-7 select-window -t 7
bind -n M-8 select-window -t 8
bind -n M-9 select-window -t 9

# Switch windows with Alt+arrow (no prefix needed)
bind -n M-Left  previous-window
bind -n M-Right next-window

# Switch panes with Alt+hjkl
bind -n M-h select-pane -L
bind -n M-j select-pane -D
bind -n M-k select-pane -U
bind -n M-l select-pane -R

# Copy mode with vim keys
setw -g mode-keys vi
bind Enter copy-mode
# Update default binding of `Enter` and `y` to use copy-pipe
bind-key -T copy-mode-vi v send-keys -X begin-selection
bind-key -T copy-mode-vi y send-keys -X copy-pipe-and-cancel "pbcopy"
bind-key -T copy-mode-vi MouseDragEnd1Pane send-keys -X copy-pipe-and-cancel "pbcopy"

# =============================================================================
# Status bar
# =============================================================================

set -g status-position bottom
set -g status-interval 5
set -g status-style "bg=#1e1e2e,fg=#cdd6f4"

# Left: session name
set -g status-left-length 30
set -g status-left "#[bg=#89b4fa,fg=#1e1e2e,bold] #S #[default] "

# Right: host, date, time
set -g status-right-length 60
set -g status-right "#[fg=#a6adc8] %a %Y-%m-%d  %H:%M #[fg=#89b4fa]#H "

# Window list
setw -g window-status-format         " #I:#W "
setw -g window-status-current-format "#[bg=#313244,fg=#89b4fa,bold] #I:#W "
setw -g window-status-style          "fg=#a6adc8"
setw -g window-status-activity-style "fg=#f9e2af"

# Pane borders
set -g pane-border-style        "fg=#313244"
set -g pane-active-border-style "fg=#89b4fa"

# Message style
set -g message-style "bg=#313244,fg=#cdd6f4"

# crazy overrides
# Allow cursor shape changes to pass through tmux
set -ga terminal-overrides ',*:Ss=\E[%p1%d q:Se=\E[2 q'
